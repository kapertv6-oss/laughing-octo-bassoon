<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LAVA AI - Загрузка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050000;
            height: var(--tg-viewport-stable-height, 100vh);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0202 0%, #050000 100%);
        }

        .loader-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
        }

        .ripple {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 42, 42, 0.4);
            animation: ripple-anim 2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
            z-index: 1;
        }
        .ripple:nth-child(2) {
            animation-delay: 1s;
        }

        .loader-image {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            border: 3px solid #ff2a2a;
            box-shadow: 0 0 30px rgba(255, 42, 42, 0.8), inset 0 0 20px rgba(255, 42, 42, 0.5);
            animation: pulse-image 2s infinite ease-in-out;
        }

        .text-container {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
        }

        .loading-title {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff2a2a, #ff8a8a, #ff2a2a);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 42, 42, 0.3);
        }

        .loading-percent {
            font-size: 16px;
            font-weight: 600;
            color: #b38585;
            font-variant-numeric: tabular-nums; 
        }

        .progress-container {
            width: 260px;
            height: 8px;
            background-color: #1f0808;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff2a2a, #ff6b6b);
            box-shadow: 0 0 15px #ff2a2a, 0 0 5px #ff2a2a;
            transition: width 0.1s linear; 
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes pulse-image {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 42, 42, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 42, 42, 1); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 42, 42, 0.6); }
        }

        @keyframes ripple-anim {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .fade-out {
            animation: fadeOutScreen 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeOutScreen {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(1.1); visibility: hidden; }
        }
    </style>
</head>
<body>

    <div id="loader-screen" style="display: flex; flex-direction: column; align-items: center;">
        
        <div class="loader-wrapper">
            <div class="ripple"></div>
            <div class="ripple"></div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSt2f7lZzNgsqHgcf3Lx0DwEZlpSo_QK6qzyTKPPEqQWySwml_KteqvmPc&s=10" alt="LAVA Logo" class="loader-image">
        </div>

        <div class="text-container">
            <div class="loading-title">Инициализация</div>
            <div class="loading-percent" id="percent-text">0%</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-fill"></div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Включаем полный экран прямо со старта
        tg.expand();
        try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}
        try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e) {}
        
        tg.ready();
        tg.setBackgroundColor('#050000'); 
        tg.setHeaderColor('#050000');

        const progressFill = document.getElementById('progress-fill');
        const percentText = document.getElementById('percent-text');
        let currentProgress = 0;
        
        function simulateLoading() {
            const step = Math.random() * 4 + 1; 
            currentProgress += step;

            if (currentProgress > 100) {
                currentProgress = 100;
            }

            progressFill.style.width = currentProgress + '%';
            percentText.textContent = Math.floor(currentProgress) + '%';

            if (currentProgress < 100) {
                setTimeout(simulateLoading, Math.random() * 120 + 30);
            } else {
                percentText.textContent = 'ГОТОВО';
                percentText.style.color = '#ff2a2a';
                percentText.style.textShadow = '0 0 10px rgba(255, 42, 42, 0.5)';
                
                setTimeout(() => {
                    document.body.classList.add('fade-out');
                    
                    // ПЕРЕАДРЕСАЦИЯ НА ИНДЕКС
                    setTimeout(() => {
                        window.location.href = '/index.html'; 
                    }, 600);
                    
                }, 600);
            }
        }

        setTimeout(simulateLoading, 300);
    </script>
</body>
</html>
