<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LAVA AI - Чат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0000;
            --bg-surface: #140505;
            --accent-red: #ff2a2a;
            --accent-red-hover: #d41717;
            --text-main: #fff0f0;
            --text-muted: #b38585;
            --border-color: #3d1414;
            --coin-gold: #ffb703; 
            
            --msg-user: #ff2a2a;
            --msg-ai: #1f0808;
            --monologue-color: var(--accent-red); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: var(--tg-viewport-stable-height, 100vh);
        }

        /* Увеличен отступ сверху (44px) для защиты от челки */
        .chat-header {
            display: flex; align-items: center; 
            padding: calc(44px + var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px 12px;
            background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); z-index: 10;
        }

        .back-btn {
            background: none; border: none; color: var(--accent-red);
            padding: 8px; margin-left: -8px; margin-right: 8px; cursor: pointer;
            display: flex; align-items: center;
        }

        .char-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            object-fit: cover; border: 1px solid var(--accent-red); margin-right: 12px;
        }

        .char-info { flex-grow: 1; }
        .char-name { font-size: 15px; font-weight: 700; }
        .char-status { font-size: 11px; color: var(--accent-red); margin-top: 2px; }

        .balance-pill {
            display: flex; align-items: center; background-color: rgba(255, 42, 42, 0.1);
            border: 1px solid var(--accent-red); padding: 4px 10px; border-radius: 20px;
        }
        .coin-icon { width: 16px; height: 16px; object-fit: contain; margin-right: 6px; }
        .balance-amount { font-weight: 700; font-size: 13px; color: var(--text-main); }

        .chat-actions {
            display: flex; gap: 8px; padding: 8px 16px; 
            background-color: var(--bg-main); border-bottom: 1px solid var(--border-color);
        }
        
        .action-btn {
            background-color: var(--bg-surface); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 20px; padding: 8px 14px;
            font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 6px; font-family: 'Montserrat', sans-serif;
        }
        .action-btn:active { transform: scale(0.95); }
        
        .btn-nsfw { flex-grow: 1; justify-content: center; }
        .btn-nsfw.active {
            background-color: rgba(255, 42, 42, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
        }

        .chat-container {
            flex-grow: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
        }

        .message {
            max-width: 85%; padding: 12px 16px; border-radius: 18px;
            font-size: 14px; line-height: 1.5; word-wrap: break-word;
            /* Плавное выплывание сообщения */
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0; 
            transform: translateY(15px);
        }

        @keyframes fadeIn { 
            to { opacity: 1; transform: translateY(0); } 
        }

        .msg-user {
            background-color: var(--msg-user); color: #fff;
            align-self: flex-end; border-bottom-right-radius: 4px;
        }

        .msg-ai {
            background-color: var(--msg-ai); border: 1px solid var(--border-color);
            color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px;
        }

        .monologue-container {
            background-color: rgba(255, 255, 255, 0.03);
            border-left: 2px solid var(--monologue-color);
            border-radius: 6px; margin-bottom: 10px; overflow: hidden;
        }

        .monologue-header {
            display: flex; align-items: center; padding: 10px 12px;
            cursor: pointer; font-size: 11px; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase; user-select: none;
        }
        
        .monologue-header:hover { background-color: rgba(255, 255, 255, 0.05); }
        .monologue-header-text { margin-right: 8px; color: var(--monologue-color); letter-spacing: 0.5px; }
        
        .monologue-preview {
            color: #777; font-size: 12px; font-weight: normal; font-style: italic;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex-grow: 1; text-transform: none;
        }

        .monologue-content {
            display: none; padding: 0 12px 12px 12px;
            font-size: 13px; font-style: italic; color: #888;
        }
        .monologue-content.open { display: block; }

        .chevron { width: 14px; height: 14px; fill: var(--text-muted); transition: transform 0.2s; margin-left: 6px; }
        .chevron.open { transform: rotate(180deg); }
        
        .ai-text-content { white-space: pre-wrap; }
        .action-text { font-style: italic; color: #996666; }

        .typing-indicator {
            display: none; align-items: center; gap: 4px;
            padding: 12px 16px; background-color: var(--msg-ai);
            border: 1px solid var(--border-color);
            border-radius: 18px; border-bottom-left-radius: 4px;
            align-self: flex-start; width: fit-content;
        }
        .dot { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .input-area {
            display: flex; align-items: flex-end; gap: 8px;
            padding: 12px 16px calc(12px + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); 
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-color);
        }

        .message-input {
            flex-grow: 1; background-color: var(--bg-main); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 12px 16px; border-radius: 24px;
            font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none;
            resize: none; max-height: 100px; overflow-y: auto; transition: 0.2s;
        }
        
        /* Стили для ЗАБЛОКИРОВАННОГО поля ввода */
        .message-input:disabled {
            background-color: var(--bg-surface-hover);
            color: var(--text-muted);
            opacity: 0.7;
        }
        .message-input:focus { border-color: var(--accent-red); }

        .send-btn {
            background-color: var(--accent-red); border: none; border-radius: 50%;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .send-btn:disabled { background-color: #521616; cursor: not-allowed; }
        .send-btn:active { transform: scale(0.9); }
        .send-icon { width: 20px; height: 20px; fill: #fff; transform: translateX(2px); }
    </style>
</head>
<body>
    <header class="chat-header">
        <button class="back-btn" onclick="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line> <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <img id="header-avatar" class="char-avatar" src="https://via.placeholder.com/40/140505/ff2a2a?text=AI">
        <div class="char-info">
            <div id="header-name" class="char-name">Загрузка...</div>
            <div class="char-status">В сети</div>
        </div>
        <div class="balance-pill">
            <img src="coin.png" class="coin-icon" alt="LC">
            <span id="chat-balance" class="balance-amount">0</span>
        </div>
    </header>

    <div class="chat-actions">
        <button id="btn-nsfw" class="action-btn btn-nsfw" onclick="toggleNsfw()">
            😈 Режим пошлости
        </button>
        <button class="action-btn" onclick="clearChat()">
            🗑️ Очистить
        </button>
    </div>

    <div id="chat-container" class="chat-container">
        <!-- Сообщения -->
        <div id="typing-indicator" class="typing-indicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <div class="input-area">
        <textarea id="message-input" class="message-input" rows="1" placeholder="Ваше сообщение..." oninput="autoResize(this)"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()">
            <svg class="send-icon" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Включаем полноэкранный режим
        tg.expand();
        try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}
        try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e) {}
        // Включаем предупреждение при закрытии (Telegram сам покажет системный диалог)
        try { if (tg.enableClosingConfirmation) tg.enableClosingConfirmation(); } catch(e) {}
        
        tg.ready();
        tg.setBackgroundColor('#140505'); tg.setHeaderColor('#140505');

        const API_BASE_URL = '/api/v1'; 
        const NGROK_HEADERS = { 'ngrok-skip-browser-warning': '69420' };

        const urlParams = new URLSearchParams(window.location.search);
        const charId = urlParams.get('character_id');
        let currentCoins = 0;
        
        let isNsfwMode = false; // Состояние режима 18+
        let charGlobalName = "AI";

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 100 ? textarea.scrollHeight : 100) + 'px';
        }

        function goBack() {
            tg.HapticFeedback.impactOccurred('light');
            window.location.href = '/';
        }

        function formatMessageText(text) {
            let escaped = text.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
            return escaped.replace(/\*(.*?)\*/g, '<span class="action-text">*$1*</span>');
        }

        async function toggleNsfw() {
            tg.HapticFeedback.impactOccurred('medium');
            isNsfwMode = !isNsfwMode;
            
            const btn = document.getElementById('btn-nsfw');
            if (isNsfwMode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            await reloadChat();
        }

        function clearChat() {
            tg.HapticFeedback.impactOccurred('medium');
            const modeName = isNsfwMode ? "ПОШЛЫЙ" : "ОБЫЧНЫЙ";
            
            tg.showConfirm(`Вы уверены, что хотите полностью удалить ${modeName} чат с этим персонажем? Отменить это будет нельзя.`, async (confirmed) => {
                if (confirmed) {
                    try {
                        const res = await fetch(`${API_BASE_URL}/chat/${charId}/history?is_nsfw=${isNsfwMode ? 1 : 0}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS }
                        });
                        if (res.ok) {
                            tg.showAlert(`${modeName} чат очищен.`);
                            await reloadChat();
                        } else {
                            tg.showAlert("Ошибка при очистке чата.");
                        }
                    } catch (e) {
                        console.error(e);
                        tg.showAlert("Ошибка сети.");
                    }
                }
            });
        }

        async function reloadChat() {
            const chatContainer = document.getElementById('chat-container');
            const messages = chatContainer.querySelectorAll('.message');
            messages.forEach(m => m.remove());

            try {
                const historyRes = await fetch(`${API_BASE_URL}/chat/${charId}/history?is_nsfw=${isNsfwMode ? 1 : 0}`, {
                    headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS }
                });
                
                if (historyRes.ok) {
                    const history = await historyRes.json();
                    if (history.length > 0) {
                        history.forEach(msg => appendMessage(msg.role, msg.content));
                    } else {
                        let greeting = `(мысли: Нужно поздороваться...)\n*я слегка улыбнулась* Привет! Я ${charGlobalName}. О чем поболтаем?`;
                        if (isNsfwMode) {
                            greeting = `(мысли: Какой интересный человек...)\n*я окинула тебя взглядом, загадочно улыбаясь* Привет... Я ${charGlobalName}. Чем займемся?`;
                        }
                        appendMessage('ai', greeting);
                    }
                }
            } catch (e) { console.error("Ошибка загрузки истории", e); }
        }

        async function initChat() {
            if (!charId) { tg.showAlert("Ошибка: Персонаж не выбран."); return goBack(); }

            try {
                const profileRes = await fetch(`${API_BASE_URL}/profile`, { headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS } });
                if (profileRes.ok) {
                    const pData = await profileRes.json();
                    currentCoins = pData.coins;
                    document.getElementById('chat-balance').textContent = currentCoins;
                }

                const charsRes = await fetch(`${API_BASE_URL}/characters`, { headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS } });
                if (charsRes.ok) {
                    const chars = await charsRes.json();
                    const currentChar = chars.find(c => c.id === charId);
                    if (currentChar) {
                        charGlobalName = currentChar.name;
                        document.getElementById('header-name').textContent = charGlobalName;
                        document.getElementById('header-avatar').src = currentChar.avatar_url;
                    }
                }

                await reloadChat();

            } catch (e) {
                console.error("Ошибка инициализации", e);
            }
        }

        function appendMessage(sender, text) {
            const chatContainer = document.getElementById('chat-container');
            const typingIndicator = document.getElementById('typing-indicator');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message msg-${sender}`;
            
            if (sender === 'ai') {
                const match = text.match(/\(\s*мысли\s*:\s*(.*?)\s*\)/i);
                
                if (match) {
                    const thoughtsText = match[1].trim();
                    const mainText = text.replace(match[0], '').trim();
                    
                    const monoDiv = document.createElement('div');
                    monoDiv.className = 'monologue-container';
                    
                    const header = document.createElement('div');
                    header.className = 'monologue-header';
                    
                    const titleText = document.createElement('span');
                    titleText.className = 'monologue-header-text';
                    titleText.textContent = 'МОНОЛОГ';
                    
                    const preview = document.createElement('span');
                    preview.className = 'monologue-preview';
                    preview.textContent = thoughtsText;
                    
                    const chevron = document.createElement('div');
                    chevron.innerHTML = `<svg class="chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>`;
                    
                    header.appendChild(titleText); header.appendChild(preview); header.appendChild(chevron);
                    
                    const content = document.createElement('div');
                    content.className = 'monologue-content';
                    content.textContent = thoughtsText;
                    
                    header.onclick = function() {
                        const isOpen = content.classList.toggle('open');
                        chevron.querySelector('svg').classList.toggle('open');
                        preview.style.display = isOpen ? 'none' : 'block';
                        titleText.textContent = isOpen ? 'СКРЫТЬ МОНОЛОГ' : 'МОНОЛОГ';
                    };
                    
                    monoDiv.appendChild(header); monoDiv.appendChild(content);
                    msgDiv.appendChild(monoDiv);
                    
                    const textSpan = document.createElement('div');
                    textSpan.className = 'ai-text-content';
                    textSpan.innerHTML = formatMessageText(mainText); 
                    msgDiv.appendChild(textSpan);
                    
                } else {
                    msgDiv.style.whiteSpace = "pre-wrap";
                    msgDiv.innerHTML = formatMessageText(text); 
                }
            } else {
                msgDiv.style.whiteSpace = "pre-wrap";
                msgDiv.innerHTML = formatMessageText(text); 
            }
            
            chatContainer.insertBefore(msgDiv, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setTyping(isTyping) {
            const indicator = document.getElementById('typing-indicator');
            indicator.style.display = isTyping ? 'flex' : 'none';
            if (isTyping) {
                const chatContainer = document.getElementById('chat-container');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            const sendBtn = document.getElementById('send-btn');
            
            if (!text) return;
            if (currentCoins <= 0) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("Недостаточно Lava Coins. Вернитесь в главное меню для пополнения.");
                return;
            }

            tg.HapticFeedback.impactOccurred('light');
            
            input.value = '';
            input.style.height = 'auto';
            
            // БЛОКИРОВКА ВВОДА: Юзер не сможет открыть клавиатуру или нажать кнопку отправки
            input.disabled = true;
            input.placeholder = "ИИ печатает...";
            sendBtn.disabled = true;
            
            appendMessage('user', text);
            setTyping(true);

            try {
                const res = await fetch(`${API_BASE_URL}/chat/${charId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tg.initData}`,
                        ...NGROK_HEADERS
                    },
                    body: JSON.stringify({ text: text, is_nsfw: isNsfwMode })
                });

                if (res.status === 402) {
                    tg.showAlert("Недостаточно Lava Coins.");
                    currentCoins = 0;
                    document.getElementById('chat-balance').textContent = 0;
                } else if (!res.ok) {
                    throw new Error("Server error");
                } else {
                    const data = await res.json();
                    currentCoins = data.remaining_coins;
                    document.getElementById('chat-balance').textContent = currentCoins;
                    
                    appendMessage('ai', data.reply);
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } catch (e) {
                tg.showAlert("Ошибка при отправке сообщения. ИИ сейчас недоступен.");
                console.error(e);
            } finally {
                setTyping(false);
                
                // РАЗБЛОКИРОВКА ВВОДА
                input.disabled = false;
                input.placeholder = "Ваше сообщение...";
                sendBtn.disabled = false;
            }
        }

        document.getElementById('message-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        initChat();
    </script>
</body>
</html>
