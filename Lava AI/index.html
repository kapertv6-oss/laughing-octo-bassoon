<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LAVA AI (18+)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0000; --bg-surface: #140505; --bg-surface-hover: #1f0808;
            --accent-red: #ff2a2a; --accent-red-hover: #d41717; --text-main: #fff0f0;
            --text-muted: #b38585; --border-color: #3d1414; --coin-gold: #ffb703; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Montserrat', sans-serif; background-color: var(--bg-main); color: var(--text-main); 
            -webkit-font-smoothing: antialiased; overflow-x: hidden; -webkit-user-select: none; user-select: none;
            min-height: var(--tg-viewport-stable-height, 100vh);
        }
        input, textarea, select { -webkit-user-select: text; user-select: text; }
        
        /* Увеличен отступ сверху (44px) для защиты от челки и статус-бара iOS/Android */
        .navbar { display: flex; align-items: center; padding: calc(44px + var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px 12px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 20px rgba(255, 42, 42, 0.1); }
        .burger-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; margin-left: -8px; display: flex; align-items: center; justify-content: center; }
        .burger-icon { width: 28px; height: 28px; fill: currentColor; transition: 0.2s; }
        .burger-btn:active .burger-icon { fill: var(--accent-red); }
        .app-title { font-size: 19px; font-weight: 800; margin-left: 12px; flex-grow: 1; letter-spacing: 0.5px; color: var(--accent-red); text-shadow: 0 0 10px rgba(255, 42, 42, 0.4); }
        
        .balance-pill { display: flex; align-items: center; background-color: rgba(255, 42, 42, 0.1); border: 1px solid var(--accent-red); padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .balance-pill:active { transform: scale(0.95); background-color: rgba(255, 42, 42, 0.2); }
        .coin-icon { width: 20px; height: 20px; object-fit: contain; margin-right: 6px; }
        .balance-amount { font-weight: 700; font-size: 14px; color: var(--text-main); }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: 0.3s ease; z-index: 20; }
        .overlay.active { opacity: 1; visibility: visible; }
        
        /* Увеличен отступ сверху для сайдбара */
        .sidebar { position: fixed; top: 0; left: -100%; width: 80%; max-width: 320px; height: 100%; background-color: var(--bg-surface); border-right: 1px solid var(--border-color); z-index: 30; transition: 0.3s ease; padding: calc(44px + var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px))) 24px calc(24px + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); display: flex; flex-direction: column; overflow-y: auto; box-shadow: 5px 0 25px rgba(255, 42, 42, 0.15); }
        .sidebar.active { left: 0; }
        
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; min-height: 32px; }
        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .btn-icon:active { color: var(--accent-red); }
        .sidebar-title { font-size: 18px; font-weight: 600; flex-grow: 1; text-align: center; }
        
        .sidebar-view { display: none; flex-direction: column; }
        .sidebar-view.active { display: flex; }
        
        .menu-list { display: flex; flex-direction: column; gap: 12px; }
        .menu-item { display: flex; align-items: center; background-color: transparent; border: 1px solid var(--border-color); padding: 14px 16px; border-radius: 12px; color: var(--text-main); font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; text-align: left; }
        .menu-item:active { background-color: var(--bg-surface-hover); border-color: var(--accent-red); transform: scale(0.98); }
        .menu-icon { width: 20px; height: 20px; margin-right: 12px; stroke: var(--accent-red); flex-shrink: 0; }
        
        .input-group { margin-bottom: 16px; width: 100%; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .input-field, .select-field { width: 100%; background-color: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none; transition: 0.2s; }
        .input-field:focus, .select-field:focus { border-color: var(--accent-red); box-shadow: 0 0 8px rgba(255, 42, 42, 0.2); }
        textarea.input-field { resize: none; height: 80px; }
        .prompt-field { height: 120px !important; border-color: #521616; }
        
        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 10px; background-color: var(--accent-red); color: #fff; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; transition: 0.2s; text-shadow: 0 1px 2px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-action:active { background-color: var(--accent-red-hover); transform: scale(0.98); }
        .btn-gold { background-color: var(--coin-gold); color: #000; text-shadow: none; }
        .btn-gold:active { background-color: #e0a100; }
        
        .profile-card { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; }
        .avatar-container { position: relative; margin-bottom: 16px; }
        .user-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-red); }
        .user-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .user-bio { font-size: 13px; color: var(--text-muted); }
        
        .avatar-upload-label { position: relative; display: inline-block; cursor: pointer; }
        .avatar-upload-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .avatar-upload-label:active .avatar-upload-overlay { opacity: 1; }
        .admin-char-avatar { border-radius: 16px !important; border-color: var(--border-color) !important; width: 100px; height: 100px; }
        
        .admin-tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg-main); padding: 4px; border-radius: 12px; border: 1px solid var(--border-color); }
        .admin-tab { flex: 1; padding: 8px 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .admin-tab.active { background: var(--accent-red); color: #fff; }
        .admin-section { display: none; flex-direction: column; }
        .admin-section.active { display: flex; }
        
        main { padding: 16px; padding-bottom: calc(16px + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); }
        .controls-section { margin-bottom: 20px; }
        .search-container { position: relative; margin-bottom: 12px; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--text-muted); }
        .search-input { width: 100%; padding: 12px 14px 12px 42px; background-color: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 12px; font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none; }
        .filter-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; margin-top: 12px; font-weight: 600; text-transform: uppercase; }
        .filter-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .filter-group::-webkit-scrollbar { display: none; }
        .filter-chip { padding: 8px 16px; background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-muted); font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .filter-chip.active { background-color: var(--accent-red); border-color: var(--accent-red); color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .character-card { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px 12px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .character-card:active { transform: scale(0.95); border-color: var(--accent-red); }
        .char-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 2px solid transparent; transition: 0.2s; }
        .char-info .name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .char-info .desc { font-size: 11px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .state-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; color: var(--text-muted); text-align: center; }
        .loader { border: 3px solid var(--border-color); border-top: 3px solid var(--accent-red); border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .character-details-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-main); z-index: 50; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .character-details-screen.active { transform: translateX(0); }
        
        /* Увеличен отступ сверху для шапки карточки */
        .cd-header { display: flex; align-items: center; padding: calc(44px + var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px 16px; background-color: transparent; position: sticky; top: 0; }
        .cd-back-btn { background: rgba(20, 5, 5, 0.8); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); cursor: pointer; }
        .cd-back-btn:active { background: var(--bg-surface-hover); }
        .cd-content { flex-grow: 1; padding: 0 20px 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .cd-avatar { width: 160px; height: 160px; border-radius: 24px; object-fit: cover; border: 2px solid var(--accent-red); margin-bottom: 16px; box-shadow: 0 10px 30px rgba(255, 42, 42, 0.2); }
        .cd-name { font-size: 26px; font-weight: 800; color: var(--text-main); margin-bottom: 12px; }
        .cd-tags { display: flex; gap: 8px; margin-bottom: 24px; }
        .cd-desc-box { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; width: 100%; text-align: left; }
        .cd-desc-title { font-size: 12px; color: var(--accent-red); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .cd-desc-text { font-size: 14px; color: var(--text-main); line-height: 1.6; }
        
        .cd-footer { padding: 20px 20px calc(20px + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); background: linear-gradient(to top, var(--bg-main) 70%, transparent); position: sticky; bottom: 0; }

        .promo-list-item { background: var(--bg-main); border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .promo-code-text { font-weight: 700; font-size: 14px; color: var(--accent-red); }
        .promo-stats { font-size: 12px; color: var(--text-muted); }
        .promo-exhausted { text-decoration: line-through; opacity: 0.5; filter: grayscale(1); }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <button class="burger-btn" onclick="toggleSidebar()">
                <svg class="burger-icon" viewBox="0 0 24 24"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <h1 class="app-title">LAVA AI</h1>
            <div class="balance-pill" onclick="topUp()">
                <img src="coin.png" alt="Lava Coin" class="coin-icon">
                <span id="nav-balance" class="balance-amount">0</span>
            </div>
        </nav>

        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-icon" id="btn-back" onclick="navigateSidebar('menu')" style="display: none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line> <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <h2 class="sidebar-title" id="sidebar-title">Меню</h2>
                <button class="btn-icon" onclick="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line> <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- ГЛАВНОЕ МЕНЮ -->
            <div id="view-menu" class="sidebar-view active">
                <div class="menu-list">
                    <button class="menu-item" onclick="navigateSidebar('profile')">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path> <circle cx="12" cy="7" r="4"></circle>
                        </svg> Профиль и Промокоды
                    </button>
                    <!-- НОВАЯ КНОПКА: Настройки ИИ -->
                    <button class="menu-item" onclick="navigateSidebar('settings')">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg> Настройки ИИ
                    </button>
                    <button class="menu-item" onclick="topUp()" style="border-color: var(--coin-gold);">
                        <img src="coin.png" style="width: 20px; height: 20px; object-fit: contain; margin-right: 12px;">
                        Пополнить Lava Coins
                    </button>
                    <button class="menu-item" id="admin-menu-btn" onclick="navigateSidebar('admin')" style="display: none; border-color: var(--accent-red);">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg> Админ-панель
                    </button>
                </div>
            </div>

            <!-- ПРОФИЛЬ -->
            <div id="view-profile" class="sidebar-view">
                <div class="profile-card">
                    <img id="user-avatar-display" class="user-avatar" src="https://via.placeholder.com/80/140505/ff2a2a?text=U" onerror="this.src='https://via.placeholder.com/80/140505/ff2a2a?text=U'">
                    <h3 id="user-name-display" class="user-name" style="margin-top: 12px;">Загрузка...</h3>
                    <p id="user-bio-display" class="user-bio">@username</p>
                    <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Мой ID: <span id="user-tg-id">...</span></p>
                </div>
                
                <div style="background: var(--bg-main); padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 16px; border: 1px solid var(--border-color);">
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Ваш баланс:</p>
                    <p style="font-size: 18px; font-weight: 700; color: var(--coin-gold); display: flex; justify-content: center; align-items: center; gap: 6px;">
                        <span id="profile-balance">0</span> <img src="coin.png" style="width: 18px; height: 18px;">
                    </p>
                </div>
                
                <div class="input-group">
                    <input type="text" id="promo-input" class="input-field" placeholder="Введите промокод..." style="text-align: center; text-transform: uppercase;">
                    <button class="btn-action" onclick="redeemPromo()" style="margin-top: 8px; padding: 10px;">Активировать</button>
                </div>
                <button class="btn-action btn-gold" onclick="topUp()" style="margin-top: 8px;">Купить коины</button>
            </div>

            <!-- НАСТРОЙКИ ИИ -->
            <div id="view-settings" class="sidebar-view">
                <div style="text-align: center; margin-bottom: 16px;">
                    <p style="font-size: 12px; color: var(--text-muted);">Эти данные ИИ будет использовать в общении (RP).</p>
                </div>
                <div class="input-group">
                    <label>Ваше Имя (Для ИИ)</label>
                    <input type="text" id="set-name" class="input-field" placeholder="Как вас называть?">
                </div>
                <div class="input-group">
                    <label>Ваш Пол</label>
                    <select id="set-gender" class="select-field">
                        <option value="">Не указан</option>
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Размер ответа ИИ</label>
                    <select id="set-size" class="select-field">
                        <option value="small">Маленький (1-2 предложения)</option>
                        <option value="medium">Средний (Баланс)</option>
                        <option value="large">Большой (Очень детальный)</option>
                    </select>
                </div>
                <button class="btn-action btn-gold" id="btn-save-settings" onclick="saveSettings()" style="margin-top: 8px;">Сохранить настройки</button>
            </div>

            <!-- АДМИН ПАНЕЛЬ -->
            <div id="view-admin" class="sidebar-view">
                <div class="admin-tabs">
                    <div class="admin-tab active" onclick="switchAdminTab('char')">Персонажи</div>
                    <div class="admin-tab" onclick="switchAdminTab('coins')">Выдача</div>
                    <div class="admin-tab" onclick="switchAdminTab('promo')">Промокоды</div>
                </div>
                <!-- Секция 1: Создание персонажа -->
                <div id="admin-sec-char" class="admin-section active">
                    <div class="input-group" style="text-align: center;">
                        <label class="avatar-upload-label">
                            <img id="admin-avatar-preview" class="user-avatar admin-char-avatar" src="" style="display: none;">
                            <div id="admin-avatar-placeholder" class="avatar-placeholder admin-char-avatar" style="font-size: 12px; text-align: center; line-height: 1.2;">Загрузить<br>фото</div>
                            <input type="file" accept="image/*" style="display: none;" onchange="handleAdminAvatarSelect(event)">
                        </label>
                    </div>
                    <div class="input-group"><label>Имя персонажа</label><input type="text" id="admin-char-name" class="input-field" placeholder="Например: Аска"></div>
                    <div class="input-group"><label>Жанр</label><select id="admin-char-genre" class="select-field"><option value="anime">Аниме</option><option value="games">Игры</option><option value="movies">Фильмы</option></select></div>
                    <div class="input-group"><label>Пол</label><select id="admin-char-gender" class="select-field"><option value="female">Женский</option><option value="male">Мужской</option></select></div>
                    <div class="input-group"><label>Описание (Видит пользователь)</label><textarea id="admin-char-desc" class="input-field" placeholder="Легенда и краткое описание..."></textarea></div>
                    <div class="input-group"><label>Промпт ИИ (Скрыто)</label><textarea id="admin-char-prompt" class="input-field prompt-field" placeholder="Инструкции для нейросети..."></textarea></div>
                    <button class="btn-action btn-gold" id="btn-add-char" onclick="addCharacterByAdmin()">Создать персонажа</button>
                </div>
                <!-- Секция 2: Выдача коинов -->
                <div id="admin-sec-coins" class="admin-section">
                    <div class="input-group"><label>TG ID пользователя</label><input type="number" id="admin-give-id" class="input-field" placeholder="Например: 123456789"></div>
                    <div class="input-group"><label>Сумма коинов</label><input type="number" id="admin-give-amount" class="input-field" placeholder="Например: 100"></div>
                    <button class="btn-action btn-gold" id="btn-give-coins" onclick="giveCoinsByAdmin()">Начислить коины</button>
                </div>
                <!-- Секция 3: Промокоды -->
                <div id="admin-sec-promo" class="admin-section">
                    <div class="input-group"><label>Название промокода</label><input type="text" id="admin-promo-code" class="input-field" placeholder="ПРОМО100"></div>
                    <div class="input-group"><label>Награда (Коины)</label><input type="number" id="admin-promo-reward" class="input-field" placeholder="Сколько получит юзер"></div>
                    <div class="input-group"><label>Макс. активаций</label><input type="number" id="admin-promo-uses" class="input-field" placeholder="Сколько раз можно использовать"></div>
                    <button class="btn-action btn-gold" id="btn-create-promo" onclick="createPromoByAdmin()">Создать промокод</button>
                    <div style="margin-top: 16px; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Существующие коды:</div>
                    <div id="admin-promo-list"></div>
                </div>
            </div>
        </div>

        <main>
            <div class="controls-section" id="controls-section" style="display: none;">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Поиск персонажа...">
                </div>
                <div class="filter-label">Жанр</div>
                <div class="filter-group" id="genre-filters">
                    <button class="filter-chip active" data-filter="all">Все</button><button class="filter-chip" data-filter="anime">Аниме</button>
                    <button class="filter-chip" data-filter="games">Игры</button><button class="filter-chip" data-filter="movies">Фильмы</button>
                </div>
                <div class="filter-label">Пол</div>
                <div class="filter-group" id="gender-filters">
                    <button class="filter-chip active" data-filter="all">Все</button><button class="filter-chip" data-filter="male">Мужской</button>
                    <button class="filter-chip" data-filter="female">Женский</button>
                </div>
            </div>

            <div id="loading-state" class="state-container"><div class="loader"></div><p>Подключение к LAVA...</p></div>
            <div id="empty-state" class="state-container" style="display: none;"><p style="color: var(--text-main); font-weight: 600;">База пуста</p></div>
            <div id="no-results-state" class="state-container" style="display: none;"><p style="color: var(--text-main); font-weight: 600;">Ничего не найдено</p></div>
            <div id="error-state" class="state-container" style="display: none;"><p id="error-message">Ошибка загрузки</p><button onclick="fetchCharacters()" class="btn-action" style="width: auto; padding: 10px 24px; margin-top: 16px;">Повторить</button></div>

            <div id="character-grid" class="grid" style="display: none;"></div>
        </main>
        
        <div id="character-details" class="character-details-screen">
            <div class="cd-header">
                <button class="cd-back-btn" onclick="closeCharacterDetails()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line> <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
            </div>
            
            <div class="cd-content">
                <img id="cd-avatar" src="" class="cd-avatar">
                <h2 id="cd-name" class="cd-name">Имя</h2>
                <div class="cd-tags"><span id="cd-genre" class="filter-chip">Жанр</span><span id="cd-gender" class="filter-chip">Пол</span></div>
                <div class="cd-desc-box"><div class="cd-desc-title">О персонаже</div><div id="cd-desc" class="cd-desc-text">Описание...</div></div>
            </div>
            
            <div class="cd-footer">
                <button id="btn-start-chat" class="btn-action">Начать чат за 1 <img src="coin.png" style="width: 20px; height: 20px;"></button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Включаем полноэкранный режим
        tg.expand();
        try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}
        try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e) {}
        // Включаем предупреждение при закрытии (Telegram сам покажет системный диалог)
        try { if (tg.enableClosingConfirmation) tg.enableClosingConfirmation(); } catch(e) {}
        
        tg.ready();
        tg.setBackgroundColor('#0a0000'); tg.setHeaderColor('#140505');

        const API_BASE_URL = '/api/v1'; 
        const NGROK_HEADERS = { 'ngrok-skip-browser-warning': '69420' };

        let currentUser = { name: 'Гость', username: '', avatarUrl: null, coins: 0, isAdmin: false, tg_id: 0 };
        let allCharacters = []; 
        let currentFilters = { search: '', genre: 'all', gender: 'all' };
        let adminNewCharAvatarFile = null;

        const genreDict = { 'anime': 'Аниме', 'games': 'Игры', 'movies': 'Фильмы' };
        const genderDict = { 'male': 'Мужской', 'female': 'Женский' };

        async function initUserProfile() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                currentUser.name = `${user.first_name} ${user.last_name || ''}`.trim();
                currentUser.username = user.username ? `@${user.username}` : '';
                currentUser.avatarUrl = user.photo_url || null;

                try {
                    const response = await fetch(`${API_BASE_URL}/profile`, { headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS } });
                    if (response.ok) {
                        const profileData = await response.json();
                        currentUser.coins = profileData.coins;
                        currentUser.isAdmin = profileData.is_admin;
                        currentUser.tg_id = profileData.tg_id;
                        
                        document.getElementById('set-name').value = profileData.user_name || '';
                        document.getElementById('set-gender').value = profileData.user_gender || '';
                        document.getElementById('set-size').value = profileData.response_size || 'medium';
                        
                        if(currentUser.isAdmin) {
                            const webhookUrl = "https://" + window.location.host + "/webhook/telegram";
                            fetch(`${API_BASE_URL}/admin/set_webhook`, {
                                method: 'POST', headers: { 'Authorization': `Bearer ${tg.initData}`, 'Content-Type': 'application/json', ...NGROK_HEADERS },
                                body: JSON.stringify({url: webhookUrl})
                            });
                        }
                    }
                } catch (error) { console.error(error); }
            }
            updateUI();
        }

        async function saveSettings() {
            tg.HapticFeedback.impactOccurred('medium');
            const name = document.getElementById('set-name').value.trim();
            const gender = document.getElementById('set-gender').value;
            const size = document.getElementById('set-size').value;
            
            const btn = document.getElementById('btn-save-settings');
            btn.textContent = 'Сохранение...'; btn.disabled = true;
            
            try {
                const res = await fetch(`${API_BASE_URL}/settings`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${tg.initData}`, 'Content-Type': 'application/json', ...NGROK_HEADERS },
                    body: JSON.stringify({ user_name: name, user_gender: gender, response_size: size })
                });
                if(res.ok) {
                    tg.showAlert("Настройки успешно сохранены!");
                    navigateSidebar('menu');
                } else { tg.showAlert("Ошибка при сохранении."); }
            } catch (e) { tg.showAlert("Ошибка сети."); }
            finally { btn.textContent = 'Сохранить настройки'; btn.disabled = false; }
        }

        function updateUI() {
            document.getElementById('user-name-display').textContent = currentUser.name;
            document.getElementById('user-bio-display').textContent = currentUser.username || 'Без username';
            document.getElementById('user-tg-id').textContent = currentUser.tg_id;
            if (currentUser.avatarUrl) document.getElementById('user-avatar-display').src = currentUser.avatarUrl;
            
            document.getElementById('nav-balance').textContent = currentUser.coins;
            document.getElementById('profile-balance').textContent = currentUser.coins;
            document.getElementById('admin-menu-btn').style.display = currentUser.isAdmin ? 'flex' : 'none';
        }

        function topUp() {
            tg.HapticFeedback.impactOccurred('heavy');
            tg.showPopup({
                title: 'Магазин Lava Coins', message: '1 Звезда (Telegram Stars) = 10 Lava Coins\nВыберите пакет:',
                buttons: [ { id: '10', type: 'default', text: '10 ⭐️ (100 LC)' }, { id: '50', type: 'default', text: '50 ⭐️ (500 LC)' }, { type: 'cancel' } ]
            }, async (buttonId) => {
                if(buttonId === '10' || buttonId === '50') {
                    try {
                        const res = await fetch(`${API_BASE_URL}/buy/stars`, {
                            method: 'POST', headers: { 'Authorization': `Bearer ${tg.initData}`, 'Content-Type': 'application/json', ...NGROK_HEADERS },
                            body: JSON.stringify({ stars: parseInt(buttonId) })
                        });
                        const data = await res.json();
                        if(data.invoice_url) {
                            tg.openInvoice(data.invoice_url, (status) => {
                                if (status === 'paid') { tg.showAlert("Оплата успешна! Коины зачислены."); initUserProfile(); } 
                                else { tg.showAlert("Оплата отменена или не удалась."); }
                            });
                        }
                    } catch (e) { tg.showAlert("Ошибка при создании чека."); }
                }
            });
        }

        async function redeemPromo() {
            const codeInput = document.getElementById('promo-input');
            const code = codeInput.value.trim();
            if (!code) return;
            tg.HapticFeedback.impactOccurred('medium');
            try {
                const res = await fetch(`${API_BASE_URL}/promocodes/redeem`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${tg.initData}`, 'Content-Type': 'application/json', ...NGROK_HEADERS },
                    body: JSON.stringify({ code: code })
                });
                const data = await res.json();
                if (res.ok) {
                    tg.showAlert(`Промокод активирован! Вы получили ${data.reward} LC.`);
                    codeInput.value = ''; currentUser.coins = data.new_balance; updateUI();
                } else { tg.showAlert(data.detail || "Ошибка активации промокода"); }
            } catch (e) { tg.showAlert("Ошибка сети."); }
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`admin-sec-${tab}`).classList.add('active');
            if (tab === 'promo') loadAdminPromos();
        }

        function handleAdminAvatarSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('admin-avatar-preview').src = e.target.result;
                document.getElementById('admin-avatar-preview').style.display = 'block';
                document.getElementById('admin-avatar-placeholder').style.display = 'none';
                adminNewCharAvatarFile = file; 
            };
            reader.readAsDataURL(file);
        }

        async function addCharacterByAdmin() {
            tg.HapticFeedback.impactOccurred('medium');
            const name = document.getElementById('admin-char-name').value.trim();
            const desc = document.getElementById('admin-char-desc').value.trim();
            const prompt = document.getElementById('admin-char-prompt').value.trim(); 
            const genre = document.getElementById('admin-char-genre').value;
            const gender = document.getElementById('admin-char-gender').value;

            if (!name || !prompt || !adminNewCharAvatarFile) return tg.showAlert('Заполните Имя, Промпт и загрузите Аватарку!');
            const btn = document.getElementById('btn-add-char'); btn.textContent = 'Создание...'; btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('name', name); formData.append('short_desc', desc); formData.append('system_prompt', prompt); 
                formData.append('genre', genre); formData.append('gender', gender); formData.append('avatar', adminNewCharAvatarFile);

                const res = await fetch(`${API_BASE_URL}/admin/characters`, { method: 'POST', headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS }, body: formData });
                if (res.ok) {
                    tg.showAlert(`Персонаж ${name} успешно создан!`);
                    document.getElementById('admin-char-name').value = ''; document.getElementById('admin-char-desc').value = '';
                    document.getElementById('admin-char-prompt').value = ''; document.getElementById('admin-avatar-preview').style.display = 'none';
                    document.getElementById('admin-avatar-placeholder').style.display = 'flex'; adminNewCharAvatarFile = null;
                    fetchCharacters();
                } else { tg.showAlert('Ошибка сервера'); }
            } catch (err) { tg.showAlert('Ошибка при создании.'); } 
            finally { btn.textContent = 'Создать персонажа'; btn.disabled = false; }
        }

        async function giveCoinsByAdmin() {
            tg.HapticFeedback.impactOccurred('medium');
            const tgId = document.getElementById('admin-give-id').value.trim();
            const amount = document.getElementById('admin-give-amount').value.trim();
            if (!tgId || !amount) return tg.showAlert('Введите ID и сумму!');
            const btn = document.getElementById('btn-give-coins'); btn.textContent = 'Обработка...'; btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE_URL}/admin/give_coins`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${tg.initData}`, 'Content-Type': 'application/json', ...NGROK_HEADERS },
                    body: JSON.stringify({ tg_id: parseInt(tgId), amount: parseInt(amount) })
                });
                if(res.ok) { tg.showAlert(`Успешно начислено ${amount} LC пользователю ${tgId}`); document.getElementById('admin-give-amount').value = ''; }
                else { tg.showAlert('Ошибка при выдаче.'); }
            } catch(e) { tg.showAlert('Ошибка сети.'); } 
            finally { btn.textContent = 'Начислить коины'; btn.disabled = false; }
        }

        async function createPromoByAdmin() {
            tg.HapticFeedback.impactOccurred('medium');
            const code = document.getElementById('admin-promo-code').value.trim();
            const reward = document.getElementById('admin-promo-reward').value.trim();
            const maxUses = document.getElementById('admin-promo-uses').value.trim();
            if (!code || !reward || !maxUses) return tg.showAlert('Заполните все поля!');
            const btn = document.getElementById('btn-create-promo'); btn.textContent = 'Обработка...'; btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE_URL}/admin/promocodes`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${tg.initData}`, 'Content-Type': 'application/json', ...NGROK_HEADERS },
                    body: JSON.stringify({ code: code, reward: parseInt(reward), max_uses: parseInt(maxUses) })
                });
                if(res.ok) {
                    tg.showAlert(`Промокод ${code} создан!`);
                    document.getElementById('admin-promo-code').value = ''; document.getElementById('admin-promo-reward').value = ''; document.getElementById('admin-promo-uses').value = '';
                    loadAdminPromos();
                } else { tg.showAlert('Возможно такой промокод уже существует.'); }
            } catch(e) { tg.showAlert('Ошибка сети.'); } 
            finally { btn.textContent = 'Создать промокод'; btn.disabled = false; }
        }

        async function loadAdminPromos() {
            try {
                const res = await fetch(`${API_BASE_URL}/admin/promocodes`, { headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS } });
                if (res.ok) {
                    const promos = await res.json();
                    const listContainer = document.getElementById('admin-promo-list'); listContainer.innerHTML = '';
                    promos.forEach(p => {
                        const exhausted = p.current_uses >= p.max_uses;
                        listContainer.innerHTML += `<div class="promo-list-item ${exhausted ? 'promo-exhausted' : ''}"><div class="promo-code-text">${p.code}</div><div class="promo-stats">🏆 ${p.reward} LC | 👥 ${p.current_uses}/${p.max_uses}</div></div>`;
                    });
                }
            } catch(e) {}
        }

        function toggleSidebar() {
            tg.HapticFeedback.impactOccurred('light');
            const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('active'); overlay.classList.toggle('active');
            if (!sidebar.classList.contains('active')) setTimeout(() => navigateSidebar('menu'), 300);
        }

        function navigateSidebar(view) {
            document.querySelectorAll('.sidebar-view').forEach(el => el.classList.remove('active'));
            const titleEl = document.getElementById('sidebar-title'); const backBtn = document.getElementById('btn-back');

            if (view === 'menu') {
                document.getElementById('view-menu').classList.add('active'); titleEl.textContent = 'Меню'; backBtn.style.display = 'none';
            } else if (view === 'profile') {
                document.getElementById('view-profile').classList.add('active'); titleEl.textContent = 'Профиль'; backBtn.style.display = 'flex'; backBtn.onclick = () => navigateSidebar('menu');
            } else if (view === 'settings') {
                document.getElementById('view-settings').classList.add('active'); titleEl.textContent = 'Настройки ИИ'; backBtn.style.display = 'flex'; backBtn.onclick = () => navigateSidebar('menu');
            } else if (view === 'admin') {
                document.getElementById('view-admin').classList.add('active'); titleEl.textContent = 'Панель управления'; backBtn.style.display = 'flex'; backBtn.onclick = () => navigateSidebar('menu');
            }
        }

        function openCharacterDetails(char) {
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('cd-avatar').src = char.avatar_url; document.getElementById('cd-name').textContent = char.name;
            document.getElementById('cd-desc').textContent = char.short_desc || 'Легенда персонажа скрыта в тумане LAVA...';
            document.getElementById('cd-genre').textContent = genreDict[char.genre] || char.genre || 'Неизвестно';
            document.getElementById('cd-gender').textContent = genderDict[char.gender] || char.gender || 'Неизвестно';
            
            const startBtn = document.getElementById('btn-start-chat');
            startBtn.onclick = () => {
                tg.HapticFeedback.impactOccurred('medium');
                if (currentUser.coins <= 0) return tg.showAlert("Упс, у вас закончились Lava Coins. Пополните баланс для продолжения!");
                window.location.href = `/chat.html?character_id=${char.id}`;
            };
            document.getElementById('character-details').classList.add('active');
        }

        function closeCharacterDetails() { tg.HapticFeedback.impactOccurred('light'); document.getElementById('character-details').classList.remove('active'); }

        function initFilters() {
            document.getElementById('search-input').addEventListener('input', (e) => { currentFilters.search = e.target.value.toLowerCase(); applyFilters(); });
            ['genre', 'gender'].forEach(type => {
                document.querySelectorAll(`#${type}-filters .filter-chip`).forEach(chip => {
                    chip.addEventListener('click', (e) => {
                        tg.HapticFeedback.impactOccurred('light');
                        document.querySelectorAll(`#${type}-filters .filter-chip`).forEach(c => c.classList.remove('active'));
                        e.target.classList.add('active'); currentFilters[type] = e.target.dataset.filter; applyFilters();
                    });
                });
            });
        }

        function applyFilters() {
            const filtered = allCharacters.filter(char => {
                const searchMatch = char.name.toLowerCase().includes(currentFilters.search) || (char.short_desc && char.short_desc.toLowerCase().includes(currentFilters.search));
                const genreMatch = currentFilters.genre === 'all' || char.genre === currentFilters.genre;
                const genderMatch = currentFilters.gender === 'all' || char.gender === currentFilters.gender;
                return searchMatch && genreMatch && genderMatch;
            });
            renderCharacters(filtered);
        }

        function renderCharacters(charactersToRender) {
            const grid = document.getElementById('character-grid'); const noResults = document.getElementById('no-results-state');
            grid.innerHTML = '';
            if (charactersToRender.length === 0) { grid.style.display = 'none'; noResults.style.display = 'flex'; return; }
            noResults.style.display = 'none'; grid.style.display = 'grid';

            charactersToRender.forEach(char => {
                const card = document.createElement('div'); card.className = 'character-card';
                card.innerHTML = `<img src="${char.avatar_url}" class="char-avatar" onerror="this.src='https://via.placeholder.com/70/140505/ff2a2a?text=LAVA'"><div class="char-info"><h3 class="name">${char.name}</h3><p class="desc">${char.short_desc || ''}</p></div>`;
                card.onclick = () => openCharacterDetails(char);
                grid.appendChild(card);
            });
        }

        async function fetchCharacters() {
            const loading = document.getElementById('loading-state'); const error = document.getElementById('error-state');
            const empty = document.getElementById('empty-state'); const controls = document.getElementById('controls-section');
            const grid = document.getElementById('character-grid');

            loading.style.display = 'flex'; error.style.display = 'none'; empty.style.display = 'none'; controls.style.display = 'none'; grid.style.display = 'none'; grid.innerHTML = '';

            try {
                const res = await fetch(`${API_BASE_URL}/characters`, { headers: { 'Authorization': `Bearer ${tg.initData}`, ...NGROK_HEADERS } });
                if (!res.ok) throw new Error('Ошибка сервера');
                allCharacters = await res.json(); loading.style.display = 'none';
                if (!allCharacters || allCharacters.length === 0) { empty.style.display = 'flex'; return; }
                controls.style.display = 'block'; applyFilters();
            } catch (error) { loading.style.display = 'none'; document.getElementById('error-state').style.display = 'flex'; }
        }

        initUserProfile();
        initFilters();
        fetchCharacters();
    </script>
</body>
</html>
